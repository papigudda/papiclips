      const yt = '<svg viewBox="0 0 24 24"><path fill="#fff" d="M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.5 3.55 12 3.55 12 3.55s-7.5 0-9.38.5A3.02 3.02 0 0 0 .5 6.19C0 8.07 0 12 0 12s0 3.93.5 5.81a3.02 3.02 0 0 0 2.12 2.14c1.88.5 9.38.5 9.38.5s7.5 0 9.38-.5a3.02 3.02 0 0 0 2.12-2.14C24 15.93 24 12 24 12s0-3.93-.5-5.81zM9.55 15.57V8.43L15.82 12l-6.27 3.57z"/></svg>';
      const ig = '<svg viewBox="0 0 24 24"><path fill="#fff" d="M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23a3.7 3.7 0 0 1-.9 1.38c-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41a3.7 3.7 0 0 1-1.38-.9 3.7 3.7 0 0 1-.9-1.38c-.16-.42-.36-1.06-.41-2.23C2.17 15.58 2.16 15.2 2.16 12s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41C8.42 2.17 8.8 2.16 12 2.16zM12 5.84a6.16 6.16 0 1 0 0 12.32 6.16 6.16 0 0 0 0-12.32zm0 10.16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.4-11.85a1.44 1.44 0 1 0 0 2.88 1.44 1.44 0 0 0 0-2.88z"/></svg>';
      const tt = '<svg viewBox="0 0 24 24"><path fill="#fff" d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64c.3 0 .59.04.86.13v-3.5a6.37 6.37 0 0 0-.86-.05A6.34 6.34 0 0 0 3.15 15.7a6.34 6.34 0 0 0 10.86 4.43 6.3 6.3 0 0 0 1.81-4.43V8.73a8.2 8.2 0 0 0 4.77 1.52V6.8a4.85 4.85 0 0 1-1-.11z"/></svg>';
      const ok = S.status.connect || {}, admin = me.is_admin;
      const setup = admin ? await api("/api/apps").catch(() => null) : null;
      const GUIDE = {
        youtube: ["https://console.cloud.google.com/apis/credentials", "Google Cloud",
          ["Create a project and turn on <b>YouTube Data API v3</b>.", "Create an <b>OAuth client ID</b> of type <b>Web application</b>.",
           "Add the address below under <b>Authorised redirect URIs</b>.", "Paste its Client ID and Client secret here."],
          "Until Google verifies your app, people see a warning when they connect, and uploads stay private."],
        instagram: ["https://developers.facebook.com/apps", "Meta for Developers",
          ["Create a <b>Business</b> app and add <b>Instagram</b> (API setup with Instagram login).",
           "Under <b>Business login settings</b>, add the address below as a redirect URL.", "Paste the <b>Instagram app ID</b> and <b>Instagram app secret</b> from that Instagram page here. Not the <b>App ID</b> at the top of the Meta dashboard: with that one, Instagram says <i>Invalid platform app</i>."],
          "Works with Creator and Business Instagram accounts. Until Meta reviews your app, only accounts you add as testers can connect."],
        tiktok: ["https://developers.tiktok.com/apps", "TikTok for Developers",
          ["Create an app and add <b>Login Kit</b> and <b>Content Posting API</b> with Direct Post turned on.",
           "Add the address below as a redirect URI, with the scopes <b>user.info.basic</b> and <b>video.publish</b>.", "Paste the Client key and Client secret here."],
          "Until TikTok reviews your app, clips are posted as private: only the account owner sees them."]};
      const card = (pf, name, logo, bg, desc) => {
        const accs = mine(pf), st = setup?.[pf], open = S.setupOpen === pf, g = GUIDE[pf];
        const act = (ok[pf] ? `<a class="btn sm primary" href="/oauth/${pf}/start">${ic("plus")}${accs.length ? "Add another" : "Connect"}</a>`
            : admin ? `<button class="btn sm primary" data-act="appsetup" data-p="${pf}">${ic("cog")}Set up</button>` : `<span class="pill">Not set up on this server</span>`)
          + (ok[pf] && admin ? `<button class="btn sm ghost" data-act="appsetup" data-p="${pf}" title="Change this server's ${name} app">${ic("cog")}</button>` : "");
        const panel = open && st ? `<div class="appsetup">
            <p class="sub">To let people connect ${name}, register this server once with <a href="${g[0]}" target="_blank" rel="noopener">${g[1]}</a>. It takes about five minutes.</p>
            <ol>${g[2].map(x => `<li>${x}</li>`).join("")}</ol>
            <div class="copyrow"><code>${esc(st.redirect)}</code><button class="btn sm" data-act="copytext" data-t="${esc(st.redirect)}">${ic("copy")}Copy</button></div>
            ${!st.https && pf !== "youtube" ? `<p class="warnline">${name} only accepts https addresses. Put PapiClips on a domain with https (or a tunnel) and set PAPICLIPS_PUBLIC_URL to it first.</p>` : ""}
            <div class="fields"><label class="f">${esc(st.id_label)}<input id="app_id" placeholder="${st.ready ? "Saved: " + esc(st.id_hint) + ". Paste a new one to replace it" : ""}" autocomplete="off" spellcheck="false"></label>
              <label class="f">${esc(st.secret_label)}<input id="app_secret" type="password" placeholder="${st.ready ? "Saved. Paste a new one to replace it" : ""}" autocomplete="off"></label></div>
            <p class="sub">${g[3]}</p>
            <div class="row"><button class="btn primary" data-act="appsave" data-p="${pf}">Save</button><button class="btn ghost" data-act="appsetup" data-p="">Close</button></div></div>` : "";
        return `<div class="appcard"><span class="applogo" style="background:${bg}">${logo}</span>
          <div class="apptx"><b>${name}</b><span>${desc}</span>${listOf(accs)}</div><div class="appact">${act}</div>${panel}</div>`;
      };
      body.innerHTML = `<section class="set-sec"><h2>Connected apps</h2><p class="help">Connect the accounts PapiClips posts clips to: press Connect, sign in on the platform's own page, and you're back here. PapiClips never sees your passwords. Then pick which accounts each creator posts to, in that creator's Setup.</p>
        <div class="apps">
          ${card("youtube", "YouTube", yt, "#FF0000", "Post clips to your channel as Shorts.")}
          ${card("instagram", "Instagram", ig, "linear-gradient(45deg,#F58529,#DD2A7B,#8134AF)", "Post clips as Reels. Needs a Creator or Business account.")}
          ${card("tiktok", "TikTok", tt, "#000", "Post clips straight to your TikTok.")}
        </div></section>`;
    }
  } catch (e) { body.innerHTML = `<div class="set-load">${esc(e.message)}</div>`; }
}
async function saveSettings() { const d = {}; $$("#sform [data-s]").forEach(i => d[i.dataset.s] = i.value); await send("/api/settings", d, "PUT"); }

/* ============================================================ clip editor */
function openClip(jid, cid, isFullscreen = false) {
  D.jid = jid; D.cid = cid; D.sig = "";
  drawClipDlg(true);
  const dlg = $("#clipdlg");
  dlg.showModal();
  if (isFullscreen) {
    const ed = dlg.querySelector(".editor");
    if (ed) ed.classList.add("fullscreen");
  }
}

function initLiveClipEditor(j, c) {
  const dlg = $("#clipdlg");
  if (!dlg) return;
  const video = $("#prevVideo");
  const track = $("#tlTrack");
  const sel = $("#tlSelection");
  const dimL = $("#tlDimLeft");
  const dimR = $("#tlDimRight");
  const playhead = $("#tlPlayhead");
  const curTime = $("#tlCurTime");
  const totTime = $("#tlTotTime");
  const rangeText = $("#tlRangeText");
  const durText = $("#tlDurText");
  const playBtn = $("#tlPlayBtn");
  const rewindBtn = $("#tlRewindBtn");

  const startIn = dlg.querySelector('[data-f="start"]');
  const endIn = dlg.querySelector('[data-f="end"]');

  let totalDur = (c.end - c.start) || 60;
  let baseStart = Number(c.start || 0);
  let selStart = Number(startIn?.value || c.start || 0);
  let selEnd = Number(endIn?.value || c.end || (selStart + 30));

  let clipPhrases = [];
  function updateCaptionAtTime(t) {
    const capBox = $("#prevCaptionsBox");
    const capLine = $("#prevCaptionLine");
    const capToggle = dlg.querySelector('[data-f="captions"]');
    if (!capBox || !capLine) return;
    const on = capToggle ? capToggle.checked : true;
    if (!on) {
      capBox.style.display = "none";
      return;
    }
    capBox.style.display = "flex";
    if (clipPhrases && clipPhrases.length) {
      const ph = clipPhrases.find(p => t >= p.start - 0.1 && t <= p.end + 0.15);
      if (ph) {
        capLine.innerHTML = ph.words.map(w => {
          const isActive = (t >= w.s - 0.05 && t <= w.e + 0.05);
          return `<span class="${isActive ? 'active' : ''}">${esc(w.w)}</span>`;
        }).join(" ");
        return;
      }
      if (video?.paused || t < (clipPhrases[0]?.start || 0)) {
        const sample = clipPhrases.find(p => p.start >= t) || clipPhrases[0];
        if (sample) {
          capLine.innerHTML = sample.words.map((w, i) => `<span class="${i === 0 ? 'active' : ''}">${esc(w.w)}</span>`).join(" ");
          return;
        }
      }
      capLine.innerHTML = "";
    }
  }

  api(`/api/jobs/${j.id}/clips/${c.id}/captions`).then(res => {
    clipPhrases = Array.isArray(res) ? res : [];
    updateCaptionAtTime(video?.currentTime || 0);
  }).catch(() => {});

  function updateTimelineUI() {
    if (!track) return;
    const dur = (video && video.duration && isFinite(video.duration) && video.duration > 0) ? video.duration : (selEnd - selStart || 30);
    if (totTime) totTime.textContent = fmt(dur);

    const sFrac = Math.max(0, Math.min(1, (selStart - baseStart) / dur));
    const eFrac = Math.max(sFrac + 0.05, Math.min(1, (selEnd - baseStart) / dur));

    if (sel) {
      sel.style.left = (sFrac * 100) + "%";
      sel.style.width = Math.max(2, (eFrac - sFrac) * 100) + "%";
    }
    if (dimL) dimL.style.width = (sFrac * 100) + "%";
    if (dimR) dimR.style.left = (eFrac * 100) + "%";

    if (rangeText) rangeText.textContent = `${fmt(selStart)} – ${fmt(selEnd)}`;
    if (durText) durText.textContent = `(${Math.max(1, Math.round(selEnd - selStart))}s)`;
  }

  function syncPreview() {
    const hookIn = dlg.querySelector('[data-f="hook"]');
    const capToggle = dlg.querySelector('[data-f="captions"]');
    const styleSel = dlg.querySelector('[data-f="style"]');
    const laySel = dlg.querySelector('[data-f="layout"]');
    const zoomToggle = dlg.querySelector('[data-f="zoom"]');
    const tagToggle = dlg.querySelector('[data-f="tag"]');
    const handleIn = dlg.querySelector('[data-f="tag_handle"]');
    const tagStyle = dlg.querySelector('[data-f="tag_style"]');
    const tagPos = dlg.querySelector('[data-f="tag_pos"]');
    const wmIn = dlg.querySelector('[data-f="watermark"]');

    // 1. Hook / Big Text
    const hookBox = $("#prevHookSticker");
    const hookTxt = $("#prevHookText");
    if (hookBox && hookTxt) {
      const val = (hookIn?.value || "").trim();
      hookTxt.textContent = val;
      hookBox.style.display = val ? "flex" : "none";
    }

    // 2. Captions & Style
    const capBox = $("#prevCaptionsBox");
    if (capBox) {
      const on = capToggle ? capToggle.checked : true;
      capBox.style.display = on ? "flex" : "none";
      if (styleSel) capBox.setAttribute("data-style", styleSel.value);
      updateCaptionAtTime(video?.currentTime || 0);
    }

    // 3. Layout Overlay
    const overlay = $("#prevLayoutOverlay");
    const splitT = $("#prevSplitTop");
    const splitB = $("#prevSplitBottom");
    const pip = $("#prevPipBox");
    if (laySel && overlay) {
      const lay = laySel.value;
      overlay.setAttribute("data-layout", lay);
      if (splitT && splitB) {
        splitT.style.display = lay === "split" ? "flex" : "none";
        splitB.style.display = lay === "split" ? "flex" : "none";
      }
      if (pip) pip.style.display = lay === "gameplay" ? "flex" : "none";
      if (video) {
        if (lay === "crop") {
          video.style.objectFit = "cover";
          video.style.transform = "none";
        } else if (lay === "zoom" || (zoomToggle && zoomToggle.checked)) {
          video.style.objectFit = "cover";
          video.style.transform = "scale(1.2)";
        } else {
          video.style.objectFit = "cover";
          video.style.transform = "none";
        }
      }
    }

    // 4. Tag Pill
    const tagPill = $("#prevTagPill");
    const tagHandle = $("#prevTagHandle");
    if (tagPill && tagHandle) {
      const on = tagToggle ? tagToggle.checked : true;
      tagPill.style.display = on ? "inline-flex" : "none";
      const h = (handleIn?.value || "").trim();
      tagHandle.textContent = h || "@streamer";
      if (tagStyle) tagPill.setAttribute("data-style", tagStyle.value);
      if (tagPos && !tagPill.dataset.customDragged) tagPill.setAttribute("data-pos", tagPos.value);
    }

    // 5. Watermark
    const wm = $("#prevWatermark");
    if (wm && wmIn) {
      const val = wmIn.value.trim();
      wm.textContent = val;
      wm.style.display = val ? "block" : "none";
    }

    // 6. Time inputs
    if (startIn) selStart = Number(startIn.value);
    if (endIn) selEnd = Number(endIn.value);
    updateTimelineUI();
  }

  dlg.oninput = syncPreview;
  dlg.onchange = syncPreview;

  // Video listeners
  if (video) {
    video.onloadedmetadata = () => {
      totalDur = video.duration || totalDur;
      updateTimelineUI();
    };
    video.ontimeupdate = () => {
      if (curTime) curTime.textContent = fmt(video.currentTime);
      if (playhead && video.duration) {
        const pct = (video.currentTime / video.duration) * 100;
        playhead.style.left = Math.min(100, Math.max(0, pct)) + "%";
      }
      updateCaptionAtTime(video.currentTime);
    };
    const muteBtn = $("#tlMuteBtn");
    function updateMuteUI() {
      if (!muteBtn || !video) return;
      const isMuted = video.muted;
      muteBtn.innerHTML = isMuted
        ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.63 3.63a.996.996 0 000 1.41L7.29 8.7 7 9H4c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1h3l3.29 3.29c.63.63 1.71.18 1.71-.71v-4.17l4.18 4.18c-.49.37-1.02.68-1.6.91-.36.15-.58.53-.58.92 0 .69.67 1.2 1.33.95.84-.32 1.61-.79 2.29-1.37l1.76 1.76a.996.996 0 101.41-1.41L5.05 3.63a.996.996 0 00-1.42 0zM19 12c0 .82-.15 1.61-.41 2.34l1.53 1.53c.56-1.17.88-2.48.88-3.87 0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zm-7-8l-1.88 1.88L12 7.76zm4.5 8A4.5 4.5 0 0014 7.97v1.79l2.48 2.48c.01-.08.02-.16.02-.24z"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
      muteBtn.title = isMuted ? "Click to Unmute Sound" : "Click to Mute Sound";
    }
    if (muteBtn) {
      muteBtn.onclick = () => {
        video.muted = !video.muted;
        if (!video.muted) video.volume = 1.0;
        updateMuteUI();
      };
    }
    if (playBtn) {
      playBtn.onclick = () => {
        if (video.paused) {
          if (video.muted) {
            video.muted = false;
            video.volume = 1.0;
            updateMuteUI();
          }
          video.play().catch(() => {});
          playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
        } else {
          video.pause();
          playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
        }
      };
    }
    if (rewindBtn) {
      rewindBtn.onclick = () => {
        video.currentTime = 0;
        if (video.muted) {
          video.muted = false;
          video.volume = 1.0;
          updateMuteUI();
        }
        video.play().catch(() => {});
      };
    }
  }

  // Interactive Timeline Scrubber & Dragging
  let dragging = null;

  function onTrackPointer(e) {
    if (!track || !video || !video.duration) return;
    const rect = track.getBoundingClientRect();
    const x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
    const frac = Math.max(0, Math.min(1, x / rect.width));
    const t = frac * video.duration;

    if (dragging === "start") {
      selStart = Math.min(selEnd - 2, baseStart + t);
      if (startIn) startIn.value = selStart.toFixed(1);
      video.currentTime = t;
    } else if (dragging === "end") {
      selEnd = Math.max(selStart + 2, baseStart + t);
      if (endIn) endIn.value = selEnd.toFixed(1);
    } else {
      video.currentTime = t;
    }
    updateTimelineUI();
  }

  if (track) {
    track.onpointerdown = e => {
      if (e.target.closest("#tlHandleStart")) {
        dragging = "start";
      } else if (e.target.closest("#tlHandleEnd")) {
        dragging = "end";
      } else {
        dragging = "scrub";
      }
      track.setPointerCapture(e.pointerId);
      onTrackPointer(e);
    };
    track.onpointermove = e => {
      if (dragging) onTrackPointer(e);
    };
    track.onpointerup = e => {
      if (dragging) {
        try { track.releasePointerCapture(e.pointerId); } catch {}
        dragging = null;
      }
    };
  }

  // Interactive On-Video Dragging for Captions, Hook, Tag Pill, Watermark
  function makeOverlayDraggable(el, key, defX, defY) {
    if (!el) return;
    el.classList.add("prev-draggable");

    let posX = c[key + "_x"] != null ? Number(c[key + "_x"]) : defX;
    let posY = c[key + "_y"] != null ? Number(c[key + "_y"]) : defY;

    function renderPos(x, y) {
      el.style.left = x.toFixed(1) + "%";
      el.style.top = y.toFixed(1) + "%";
      el.style.right = "auto";
      el.style.bottom = "auto";
      el.style.transform = "translate(-50%, -50%)";
    }

    if (c[key + "_x"] != null || c[key + "_y"] != null || el.dataset.customDragged) {
      renderPos(posX, posY);
    }

    let isDragging = false;
    let startPointerX = 0, startPointerY = 0;
    let startElX = posX, startElY = posY;

    el.onpointerdown = e => {
      if (e.target.closest("button, a")) return;
      e.preventDefault();
      e.stopPropagation();

      isDragging = true;
      el.setPointerCapture(e.pointerId);
      el.classList.add("is-dragging");
      el.dataset.customDragged = "1";

      const frame = $("#prevFrame");
      const frameRect = frame ? frame.getBoundingClientRect() : { width: 300, height: 533, left: 0, top: 0 };

      const elRect = el.getBoundingClientRect();
      startElX = ((elRect.left + elRect.width / 2) - frameRect.left) / frameRect.width * 100;
      startElY = ((elRect.top + elRect.height / 2) - frameRect.top) / frameRect.height * 100;

      startPointerX = e.clientX;
      startPointerY = e.clientY;

      function onPointerMove(ev) {
        if (!isDragging) return;
        ev.preventDefault();
        const deltaX = ev.clientX - startPointerX;
        const deltaY = ev.clientY - startPointerY;

        const deltaXPct = (deltaX / frameRect.width) * 100;
        const deltaYPct = (deltaY / frameRect.height) * 100;

        posX = Math.max(6, Math.min(94, startElX + deltaXPct));
        posY = Math.max(5, Math.min(95, startElY + deltaYPct));

        renderPos(posX, posY);

        c[key + "_x"] = Number(posX.toFixed(1));
        c[key + "_y"] = Number(posY.toFixed(1));

        if (key === "tag") {
          const tagPosSel = dlg.querySelector('[data-f="tag_pos"]');
          if (tagPosSel) {
            let p = "bottom_centre";
            if (posY < 35) p = posX < 50 ? "top_left" : "top_right";
            else if (posX < 38) p = "bottom_left";
            else if (posX > 62) p = "bottom_right";
            tagPosSel.value = p;
          }
        }
      }

      function onPointerUp(ev) {
        if (!isDragging) return;
        isDragging = false;
        try { el.releasePointerCapture(ev.pointerId); } catch {}
        el.classList.remove("is-dragging");
        window.removeEventListener("pointermove", onPointerMove);
        window.removeEventListener("pointerup", onPointerUp);
      }

      window.addEventListener("pointermove", onPointerMove);
      window.addEventListener("pointerup", onPointerUp);
    };
  }

  makeOverlayDraggable($("#prevHookSticker"), "hook", 50, 18);
  makeOverlayDraggable($("#prevCaptionsBox"), "caption", 50, 70);
  makeOverlayDraggable($("#prevTagPill"), "tag", 28, 86);
  makeOverlayDraggable($("#prevWatermark"), "watermark", 82, 8);

  const tagPosDropdown = dlg.querySelector('[data-f="tag_pos"]');
  if (tagPosDropdown && !tagPosDropdown._snapBound) {
    tagPosDropdown._snapBound = true;
    tagPosDropdown.addEventListener("change", () => {
      const tp = $("#prevTagPill");
      if (tp) {
        delete tp.dataset.customDragged;
        tp.style.left = "";
        tp.style.top = "";
        tp.style.transform = "";
        tp.setAttribute("data-pos", tagPosDropdown.value);
      }
    });
  }

  syncPreview();
}

/* ============================================================ render + polling */
function render() {
  drawShell(); drawJobs(); drawStream(); drawSelBar();
  if (S.view === "overview") drawOverview();
  if ($("#clog")) drawLog();
  if (D.jid) drawClipDlg(false);
}
async function tick() {
  try {
    const got = await api("/api/sync?v=" + encodeURIComponent(S.syncV || ""));
    const fresh = !!got.jobs, stale = Date.now() - (S.ovAt || 0) > 20000;
    S.syncV = got.v;
    if (!fresh) {                                   // nothing of ours changed on the server
      if (S.view === "overview" && stale) { S.overview = await api("/api/overview"); S.ovAt = Date.now(); render(); }
      return;
    }
    const {jobs, creators, accounts} = got;
    // a server from before multi-channel support sends only `channel`: show it as that platform's channel
    creators.forEach(c => { if (!c.channels) { const u = c.channel || "", k = /youtu/i.test(u) ? "youtube" : /twitch/i.test(u) ? "twitch" : /kick/i.test(u) ? "kick" : ""; c.channels = k ? {[k]: u} : {}; } });
    S.jobs = jobs; S.creators = creators; S.accounts = accounts;
    if (got.ai) S.status.ai = got.ai;
    if (got.unread != null) S.status.unread = got.unread;
    if (S.view === "overview") { S.overview = await api("/api/overview"); S.ovAt = Date.now(); }
    if (creatorId() && !creator()) return go("overview");
    render();
  } catch {}
}
// Back on the tab (or window): ask straight away instead of waiting out the slow background timer, and put a
// live player that fell behind while hidden back at the live edge.
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  tick();
  if (hiddenAt && Date.now() - hiddenAt > 60000) {   // away a while: jump back to the live moment
    const pl = $("#stream .player"), f = pl?.querySelector("iframe");
    if (f) { const src = f.src; f.src = "about:blank"; requestAnimationFrame(() => { f.src = src; }); }
  }
  hiddenAt = 0;
});
window.addEventListener("focus", () => { if (!document.hidden) tick(); });
function loop() {
  const active = S.jobs.some(j => ["queued", "running", "live"].includes(j.status) || j.clips.some(c => c.status === "queued" || c.status === "rendering"));
  // quick while something is being made, relaxed otherwise, and slow when the tab is in the background
  const waiting = S.creators.some(c => (c.channels && Object.keys(c.channels).length && !c.profile?.pic) || c.live_job && !jobOf(c.live_job));
  setTimeout(async () => { await tick(); loop(); }, document.hidden ? 20000 : waiting ? 1000 : active ? 2000 : 4000);
}

      await send(`/api/jobs/${D.jid}/clips/${D.cid}/render`, body);
      toast(a === "done_remake" ? "Clip finalized! Rendering now…" : "Re-making the clip…", "ok");
      if (a === "done_remake") $("#clipdlg").close();
      return tick();
    }
    if (a === "postnow" || a === "postqueue") {
      const accs = $$("#clipdlg [data-pacc]:checked").map(i => i.value);
      if (!accs.length) return toast("Tick at least one account first.", "bad");
      if (a === "postnow" && !await ask("Post now?", `This clip goes to ${accs.length} account${accs.length > 1 ? "s" : ""} straight away.`, "Post now")) return;
      await send("/api/posts", {job:D.jid, clip:D.cid, accounts:accs, now:a === "postnow"});
      toast(a === "postnow" ? "Posting now" : "Added to the queue", "ok"); return tick();
    }
  } catch (err) { b.disabled = false; toast(err.message, "bad"); }
});

$("#collapseBtn").innerHTML = ic("sidebar"); $("#menuBtn").innerHTML = ic("menu");
try { if (localStorage.getItem("mini")) $("#app").classList.add("mini"); } catch {}
$("#main").addEventListener("scroll", () => $(".topbar").classList.toggle("stuck", $("#main").scrollTop > 4), {passive:true});
(async () => {
  try { S.status = await api("/api/status"); } catch {}
  const q = new URLSearchParams(location.search);
  if (q.get("connected") || q.get("connect_error")) {
    const ok = q.get("connected"), err = q.get("connect_error"), nm = q.get("name");
    history.replaceState(null, "", location.pathname);
    setTimeout(() => ok ? toast(`${nm || ok} is connected. Pick it in a creator's Setup to post there.`, "ok") : toast(err, "bad"), 300);
  }
  if (q.get("verified")) { history.replaceState(null, "", location.pathname); setTimeout(() => toast("Email confirmed. You're ready to clip.", "ok"), 300); }
  if (q.get("verify_error")) { history.replaceState(null, "", location.pathname); setTimeout(() => toast(q.get("verify_error"), "bad"), 300); }
  if (location.pathname.startsWith("/app/")) { const [v, tab] = fromPath(location.pathname); S.view = v; S.ctab = tab; }  // the address decides, before anything loads
  await tick();
  { const [v, tab] = location.pathname.startsWith("/app/") ? fromPath(location.pathname) : ["overview", "clips"]; go(v, tab, true); remember(S.view, S.ctab, "replace"); }
  const fromSite = takeClipLink(CLIP_HASH);
  if (fromSite) history.replaceState(null, "", location.pathname);
  try {  // a link pasted on the home page before signing up
    const link = fromSite ? "" : sessionStorage.getItem("papiclips_link");
    if (link) { sessionStorage.removeItem("papiclips_link"); go("overview"); $("#url").value = link; onLink($("#url")); $("#url").focus(); toast("Your link is ready. Press Make clips.", "ok"); }
  } catch {}
  const editJob = q.get("edit_job") || q.get("job");
  const editClip = q.get("edit_clip") || q.get("clip");
  if (editJob && editClip) {
    setTimeout(() => openClip(editJob, editClip, !!q.get("edit_job")), 350);
  }
  loop();
  if (S.status.tour && !fromSite && !$("#formdlg").open) setTimeout(startTour, 500);   // once, the first time someone signs in
  checkNew(true);
  setInterval(async () => { try { S.status = await api("/api/status"); drawShell(); if (S.view === "overview") drawOverview(); checkNew(); } catch {} }, 15000);
})();
</script>
