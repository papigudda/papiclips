*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--frame);color:var(--frame-text);padding:14px 10px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}

.ni{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:8px;border:0;background:transparent;color:var(--frame-text);font-weight:500;cursor:pointer;text-decoration:none;width:100%;text-align:left;transition:background-color .15s ease}
.ni:hover{background:var(--frame-2)}.ni.on{background:var(--frame-2);color:#fff}.ni.on svg{color:var(--brand)}

.main{background:#fff;min-width:0;border-radius:16px 0 0 16px;margin:8px 0;padding:0 0 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 32px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5;border-radius:16px 0 0 0}

.view{padding:24px 32px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:#fff;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background-color .15s ease,border-color .15s ease}

.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--ink)}.btn.primary:hover{background:var(--brand-hi)}
.btn.dark{background:var(--frame);border-color:var(--frame);color:#fff}.btn.dark:hover{background:#3A2C25}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}.btn.good:hover{background:#0b7449}
.btn.bad{color:var(--bad)}.btn.bad:hover{background:var(--bad-soft)}
.btn.xs{height:28px;padding:0 9px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px}
.kpi span{color:var(--dim);font-size:13px}.kpi b{display:block;font-size:28px;letter-spacing:-.04em;font-weight:700;margin-top:2px}
.kpi.hi{background:var(--frame);border-color:var(--frame)}.kpi.hi span{color:var(--frame-dim)}.kpi.hi b{color:var(--brand)}
.card{border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-top:16px}
.card h3{font-size:16px;margin-bottom:12px}
.note{border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;margin-top:16px}
.note.warn{background:var(--warn-soft);color:#6B4200}.note.info{background:var(--soft);color:var(--deep)}
.note .btn{margin-left:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--faint);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#FCFBFA}
.tw{overflow-x:auto}

.meter i{display:block;height:100%;background:var(--brand)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}

.who b{display:block;font-weight:600}.who small{color:var(--faint);display:block;font-size:12px}
.link a{font-weight:500;text-decoration:none;display:block;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link a:hover{color:var(--deep)}
.link small{color:var(--faint);font-size:12px;display:block}
.vin{width:96px;height:30px;border:1px solid var(--line-2);border-radius:7px;padding:0 8px;text-align:right;font-variant-numeric:tabular-nums}
.vin:focus{border-color:var(--brand);outline:0}
.num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--line);display:block}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:0 12px;height:36px;cursor:pointer;font-weight:500;color:var(--dim);border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--frame);color:#fff}
.seg .c{font-size:11px;opacity:.75;margin-left:4px}
.inp{height:36px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;background:#fff;outline:0}
.inp:focus{border-color:var(--brand)}
.bulk{position:sticky;bottom:16px;margin-top:14px;background:var(--frame);color:#fff;border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:10px;align-items:center}

.field{margin-bottom:12px}

.preview{background:var(--soft);border-radius:10px;padding:12px 14px;color:var(--deep);font-size:13px}
.cover-prev{width:100%;aspect-ratio:16/7;border-radius:12px;object-fit:cover;border:1px solid var(--line);background:var(--muted);display:block}

.empty{border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:40px;text-align:center;color:var(--dim)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
code{background:var(--muted);padding:1px 6px;border-radius:5px;font-size:13px}
ol.steps{padding-left:18px;color:var(--dim);display:grid;gap:6px;margin:10px 0 0}

.inapp{display:flex;gap:10px;align-items:flex-start;background:#F5FDE0;border:1px solid #E3F7A8;color:#2B3A00;border-radius:12px;padding:10px 12px;font-size:13px;margin:0 0 12px}

@media (max-width:700px){.srow-h{grid-template-columns:1fr}.s-thumb{width:160px}}

async function api(path, opts = {}) {
  const o = {method: opts.method || "GET", headers: {}};
  if (opts.body instanceof FormData) o.body = opts.body;
  else if (opts.body !== undefined) { o.body = JSON.stringify(opts.body); o.headers["Content-Type"] = "application/json"; }
  const r = await fetch(path, o); let d = null; try { d = await r.json(); } catch {}
  if (r.status === 413 || (r.status === 502 && opts.body instanceof FormData)) throw new Error("That file is too big. Use an image under 8 MB.");
  if (!r.ok) throw new Error((d && d.detail) || "Something went wrong.");
  return d;
}

        <a class="btn xs" href="/earn#c=${esc(c.slug)}" target="_blank">View</a></div></td></tr>`).join("")}</tbody></table></div>`;
}

const TS_LINE = /^\s*(\d{1,2}:)?\d{1,2}:\d{2}/;
function streamRows(c) {

    <textarea class="inp s-ts" rows="4" placeholder="Best moments of this stream, one per line (optional):&#10;2:37:12 heavy driving race to the club&#10;2:44:30-2:45:53">${esc(r.timestamps || "")}</textarea>
    <div class="s-info">${n ? `✓ ${n} moments` : "No best moments yet"}</div></div>`;
}
// The picture of a stream's link, as the PapiClips app shows it (read by this server: YouTube, Twitch, Kick).
function thumbImg(url) {
  url = (url || "").trim();
  if (!/^https?:\/\/([\w-]+\.)*(youtube\.com|youtu\.be|twitch\.tv|kick\.com)\//i.test(url)) return url ? "No picture" : "Add a link";
  return `<img src="/api/link-thumb?url=${encodeURIComponent(url)}" alt="" loading="lazy">No picture`;
}
let thumbTimer = 0;
document.addEventListener("error", e => { if (e.target?.closest?.(".s-thumb")) e.target.classList.add("broken"); }, true);
function readStreams() {
  return $$("#streams .srow").map(row => ({name: row.querySelector(".s-name").value.trim().replace(/[|\n]/g, " "),
    url: row.querySelector(".s-url").value.trim(), timestamps: row.querySelector(".s-ts").value}))
    .filter(r => r.url || r.timestamps.trim());
}
// The boxes go to the server as the two texts it keeps: the streams, one "Name | link" per line, and the best moments,
// each stream's times under a line with its name and link, so every time is tied to its own stream.
function serializeStreams(f) {
  const rows = readStreams();
  for (const r of rows) {
    if (r.url && !/^https?:\/\//i.test(r.url)) r.url = "https://" + r.url;
    if (r.timestamps.trim() && !r.url) throw new Error(`Add the link of "${r.name || "the stream"}", so its best moments open it.`);
  }
  // the same link in two boxes is one stream: its times are put together
  const byUrl = new Map();
  for (const r of rows) {
    const k = r.url.toLowerCase();
    if (r.url && byUrl.has(k)) { const o = byUrl.get(k); o.timestamps = [o.timestamps.trim(), r.timestamps.trim()].filter(Boolean).join("\n"); o.name = o.name || r.name; }
    else byUrl.set(r.url ? k : Symbol(), r);
  }
  rows.length = 0; rows.push(...byUrl.values());
  f.sources.value = rows.filter(r => r.url).map(r => (r.name ? r.name + " | " : "") + r.url).join("\n");
  f.moments.value = rows.filter(r => r.timestamps.trim()).map(r => `${r.name || "Stream"} | ${r.url}\n${r.timestamps.trim()}`).join("\n\n");
}
document.addEventListener("input", e => {
  const row = e.target.closest?.(".srow"); if (!row) return;
  if (e.target.classList.contains("s-url")) {
    clearTimeout(thumbTimer);
    thumbTimer = setTimeout(() => { const t = row.querySelector(".s-thumb"); if (t) t.innerHTML = thumbImg(e.target.value); }, 600);
  }
  const n = row.querySelector(".s-ts").value.split("\n").filter(l => TS_LINE.test(l)).length;
  row.querySelector(".s-info").textContent = n ? `✓ ${n} moments` : "No best moments yet";
});

        <span class="dimt">${esc(x.name || x.email || x.contact || "no contact given")}${x.contact && (x.name || x.email) ? " · " + esc(x.contact) : ""}</span>
        <span style="flex:1"></span>
        ${x.contact ? `<button class="btn xs" data-act="copy" data-v="${esc(x.contact)}" data-what="Contact">Copy contact</button>` : ""}
        ${x.status !== "seen" ? `<button class="btn xs" data-act="bset" data-id="${x.id}" data-s="seen">Looking into it</button>` : ""}
        ${x.status !== "done" ? `<button class="btn xs good" data-act="bset" data-id="${x.id}" data-s="done">Fixed</button>` : `<button class="btn xs" data-act="bset" data-id="${x.id}" data-s="new">Reopen</button>`}</div>
      <div class="bmsg">${esc(x.message)}</div>
      ${x.app ? `<div class="dimt" style="margin-top:8px">${esc(x.app)}</div>` : ""}
      ${x.page && !x.source ? `<div class="dimt">Page: ${esc(x.page)}</div>` : ""}
      ${x.context && x.source !== "website" ? `<div class="dimt">While: ${esc(x.context)}</div>` : ""}
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        ${x.shot ? `<a class="btn xs" href="/api/admin/feedback/${x.id}/shot" target="_blank" rel="noopener">See screenshot</a>` : ""}
        ${x.diag ? `<button class="btn xs" data-act="bdiag" data-id="${x.id}">${S.open.has(x.id) ? "Hide" : "Show"} technical details</button><button class="btn xs" data-act="copy" data-v="${esc("Report #" + x.id + "\n" + x.message + "\n\n" + x.app + "\n\n" + x.diag)}" data-what="Report">Copy all</button>` : ""}</div>
      ${x.diag && S.open.has(x.id) ? `<pre class="diag">${esc(x.diag)}</pre>` : ""}
    </div>`).join("") : `<div class="card" style="text-align:center;color:var(--frame-dim)">${S.bStatus === "new" ? "No new reports. 🎉" : "Nothing here."}</div>`}`;
}

// ---------------------------------------------------------------- drawing and loading
function draw() {
  nav();
  $("#view").innerHTML = !S.sum ? "Loading…" : {overview: drawOverview, campaigns: drawCampaigns, review: drawReview, clippers: drawClippers, payouts: drawPayouts, bugs: drawBugs, settings: drawSettings}[S.tab]();
}
async function loadQueue() { S.queue = await api(`/api/admin/earn/submissions?status=${S.qStatus === "all" ? "" : S.qStatus}&campaign=${encodeURIComponent(S.qCamp)}&q=${encodeURIComponent(S.q)}`); }
async function load() {
  [S.sum, S.camps] = await Promise.all([api("/api/admin/earn/summary"), api("/api/admin/earn/campaigns")]);
  if (S.tab === "review") await loadQueue();
  if (S.tab === "payouts") S.owed = await api("/api/admin/earn/owed");
  if (S.tab === "clippers") S.clippers = (await api("/api/admin/earn/clippers")).clippers;
  if (S.tab === "bugs") S.bugs = await api("/api/admin/feedback");
  else if (!S.bugs) api("/api/admin/feedback").then(b => { S.bugs = b; nav(); }).catch(() => {});
  if (S.tab === "settings") { try { S.mail = (await api("/api/public")).mail; } catch {} }
  draw();
}
function go(tab) { S.tab = tab; S.sel.clear(); history.pushState(null, "", "/admin/earn/" + tab); draw(); load().catch(e => toast(e.message, "bad")); }
addEventListener("popstate", () => { S.tab = location.pathname.split("/")[3] || "overview"; load(); });

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab]"); if (t) { e.preventDefault(); go(t.dataset.tab); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  try {
    if (act === "new") openForm();
    else if (act === "edit") openForm(S.camps.find(c => c.id === id));
    else if (act === "close" || (act === "close-bg" && e.target === a)) $("#modal").innerHTML = "";
    else if (act === "status") {
      const c = await api("/api/admin/earn/campaigns/" + id, {method: "PUT", body: {status: a.dataset.s}});
      toast(c && c.state === "open" ? "Live and open. Clippers can join now." : c && c.state === "starts" ? `Live. It opens ${fmtWhen(c.starts_at)}, and shows locked until then.` : "Campaign is now " + (STATUS_LABEL[a.dataset.s] || a.dataset.s).toLowerCase() + ".", c && c.state === "starts" ? "" : "good");
      await load(); }
    else if (act === "move") {
      const ids = S.camps.map(x => x.id), i = ids.indexOf(id), j = i + Number(a.dataset.d);
      if (j < 0 || j >= ids.length) return;
      [ids[i], ids[j]] = [ids[j], ids[i]];
      await saveOrder(ids);
    }
    else if (act === "delete") { if (!confirm("Delete this campaign and every clip sent to it? This can't be undone.")) return; await api("/api/admin/earn/campaigns/" + id, {method: "DELETE"}); $("#modal").innerHTML = ""; toast("Deleted."); await load(); }
    else if (act === "review-camp") { S.qCamp = id; S.qStatus = "pending"; go("review"); }
    else if (act === "qstatus") { S.qStatus = a.dataset.s; S.sel.clear(); await loadQueue(); draw(); }
    else if (act === "approve" || act === "reject" || act === "reopen") {
      let note = "";
      if (act === "reject") { note = prompt("Why isn't it approved? The clipper sees this.", "Doesn't follow the campaign rules."); if (note === null) return; }
      const vin = $(`[data-views="${id}"]`), body = {action: act, note};
      if (vin && act === "approve") body.views = vin.value;
      const r = await api("/api/admin/earn/submissions/" + id, {method: "POST", body});
      toast(act === "approve" ? `Approved: ${inr(r.amount)}` : act === "reject" ? "Rejected." : "Back in review.", act === "approve" ? "good" : "");
      S.sel.delete(+id); await load();
    }
    else if (act === "bulk-approve" || act === "bulk-reject") {
      let note = "";
      if (act === "bulk-reject") { note = prompt("Reason shown to the clippers:", "Doesn't follow the campaign rules."); if (note === null) return; }
      for (const sid of S.sel) { const v = $(`[data-views="${sid}"]`); if (v) await api(`/api/admin/earn/submissions/${sid}/views`, {method: "POST", body: {views: v.value}}); }
      const r = await api("/api/admin/earn/submissions/bulk", {method: "POST", body: {ids: [...S.sel], action: act === "bulk-approve" ? "approve" : "reject", note}});
      toast(`${r.done} done${r.problems.length ? ". " + r.problems[0] : ""}`, r.problems.length ? "bad" : "good"); S.sel.clear(); await load();
    }
    else if (act === "clear-sel") { S.sel.clear(); draw(); }
    else if (act === "selall") { S.queue.items.filter(s => s.status === "pending").forEach(s => a.checked ? S.sel.add(s.id) : S.sel.delete(s.id)); draw(); }
    else if (act === "yt-refresh") { const r = await api("/api/admin/earn/refresh", {method: "POST", body: {}}); toast(`${r.updated} YouTube clips updated.`, "good"); await load(); }
    else if (act === "copy") { await navigator.clipboard.writeText(a.dataset.v); toast((a.dataset.what || "UPI ID") + " copied."); }
    else if (act === "bstatus") { S.bStatus = a.dataset.s; draw(); }
    else if (act === "addstream") { $("#streams").insertAdjacentHTML("beforeend", streamRow({name: "", url: "", timestamps: ""})); $("#streams .srow:last-child .s-name").focus(); }
    else if (act === "delstream") { const row = a.closest(".srow"); if (!row.querySelector(".s-ts").value.trim() || confirm("Remove this stream and its best moments?")) row.remove(); }
    else if (act === "bdiag") { const n = Number(id); S.open.has(n) ? S.open.delete(n) : S.open.add(n); draw(); }
    else if (act === "bset") { await api("/api/admin/feedback/" + id, {method: "POST", body: {status: a.dataset.s}}); S.bugs = await api("/api/admin/feedback"); draw(); toast(a.dataset.s === "done" ? "Marked fixed." : a.dataset.s === "seen" ? "Marked as looking into it." : "Reopened."); }
    else if (act === "pay") {
      const ref = prompt(`Send ${inr(+a.dataset.amt)} to ${a.dataset.name} from your UPI app first.\n\nThen paste the UTR / transaction reference here:`);
      if (ref === null) return;
      const r = await api("/api/admin/earn/payouts", {method: "POST", body: {user_id: id, ref}}); toast(`Recorded ${inr(r.amount)} for ${r.clips} clips.`, "good"); await load();
    }
    else if (act === "yt-clear") { await api("/api/admin/earn/settings", {method: "PUT", body: {youtube_key: ""}}); toast("Key removed."); await load(); }
  } catch (err) { toast(err.message, "bad"); }
});
document.addEventListener("change", async e => {
  if (e.target.dataset.sel) { e.target.checked ? S.sel.add(+e.target.dataset.sel) : S.sel.delete(+e.target.dataset.sel); draw(); return; }
  if (e.target.dataset.act === "qcamp") { S.qCamp = e.target.value; await loadQueue(); draw(); return; }
  if (e.target.dataset.views) {
    try { await api(`/api/admin/earn/submissions/${e.target.dataset.views}/views`, {method: "POST", body: {views: e.target.value}}); toast("Views saved."); await loadQueue(); draw(); } catch (err) { toast(err.message, "bad"); }
    return;
  }
  if (e.target.dataset.cover && e.target.files[0]) {
    const fd = new FormData(); fd.append("file", e.target.files[0]);
    try { const c = await api(`/api/admin/earn/campaigns/${e.target.dataset.cover}/cover`, {method: "POST", body: fd}); toast("Cover saved.", "good"); await load(); openForm(S.camps.find(x => x.id === c.id)); } catch (err) { toast(err.message, "bad"); }
  }
});
document.addEventListener("input", e => {
  if (e.target.closest("#cf")) mathPreview();
  if (e.target.id === "qsearch") { clearTimeout(S.qt); S.q = e.target.value; S.qt = setTimeout(async () => { await loadQueue(); draw(); const i = $("#qsearch"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 350); }
});
document.addEventListener("input", e => {
  if (e.target.id !== "cq") return;
  S.cq = e.target.value; const pos = e.target.selectionStart; draw();
  const i = $("#cq"); if (i) { i.focus(); i.setSelectionRange(pos, pos); }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  try {
    if (f.id === "cf") {
      serializeStreams(f);
      const all = Object.fromEntries(new FormData(f).entries());
      // the showcase numbers travel together, as "results"
      const d = Object.fromEntries(Object.entries(all).filter(([k]) => !k.startsWith("r_")));
      d.results = {views: all.r_views, clips: all.r_clips, clippers: all.r_clippers, top_views: all.r_top_views,
                   platforms: {instagram: all.r_instagram, youtube: all.r_youtube, x: all.r_x, tiktok: all.r_tiktok}};
      d.platforms = $$('input[name="platforms"]:checked', f).map(x => x.value);
      d.starts_at = d.starts_at ? new Date(d.starts_at).getTime() / 1000 : null;
      d.ends_at = d.ends_at ? new Date(d.ends_at).getTime() / 1000 : null;
      const file = f.cover_new && f.cover_new.files[0]; delete d.cover_new;
      const c = await api("/api/admin/earn/campaigns" + (f.dataset.id ? "/" + f.dataset.id : ""), {method: f.dataset.id ? "PUT" : "POST", body: d});
      if (file) { const fd = new FormData(); fd.append("file", file); try { await api(`/api/admin/earn/campaigns/${c.id}/cover`, {method: "POST", body: fd}); } catch (err) { toast("Saved, but the cover didn't upload: " + err.message, "bad"); } }
      toast(f.dataset.id ? "Saved." : (c.status === "live" ? "Campaign created and live." : "Campaign created. Press Go live when it's ready."), "good");
      await load();
      if (!f.dataset.id) openForm(S.camps.find(x => x.id === c.id)); else $("#modal").innerHTML = "";
    }
    if (f.id === "ytf") { await api("/api/admin/earn/settings", {method: "PUT", body: {youtube_key: f.key.value}}); toast("Key works and is saved.", "good"); await load(); }
  } catch (err) { toast(err.message, "bad"); }
});
draw();
load().catch(e => toast(e.message, "bad"));
</script>
</body>
